# Publish reviewed fork integrations without moving canonical upstream tags.
name: Release immutable fork image to GHCR

on:
    push:
        tags:
            - "fork/v0.*"

concurrency:
    group: fork-release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: write
    id-token: write
    attestations: write

jobs:
    build-and-push:
        name: Verify and publish immutable fork image
        if: github.repository == 'shockstruck/infisical' && startsWith(github.ref, 'refs/tags/fork/v0.')
        runs-on: ubuntu-latest
        env:
            IMAGE: ghcr.io/shockstruck/infisical
            RELEASE_REF: ${{ github.ref }}
            FORK_SHA: ${{ github.sha }}
        steps:
            - name: Checkout exact release commit
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false

            - name: Resolve canonical upstream identity
              id: identity
              shell: bash
              run: |
                  set -Eeuo pipefail
                  upstream_tag="${RELEASE_REF#refs/tags/fork/}"
                  test "$upstream_tag" != "$RELEASE_REF"
                  upstream_sha="$(git rev-parse "refs/tags/${upstream_tag}^{commit}")"
                  {
                    printf 'upstream_tag=%s\n' "$upstream_tag"
                    printf 'upstream_sha=%s\n' "$upstream_sha"
                  } >> "$GITHUB_OUTPUT"

            - name: Validate ref, source, and lossless tags before registry login
              env:
                  UPSTREAM_TAG: ${{ steps.identity.outputs.upstream_tag }}
                  UPSTREAM_SHA: ${{ steps.identity.outputs.upstream_sha }}
                  VERIFY_GIT: "1"
                  VALIDATE_ONLY: "1"
              run: .github/scripts/resolve-fork-release.sh > "$RUNNER_TEMP/release-validation.json"

            - name: Install pinned crane
              uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
              with:
                  version: v0.20.3

            - name: Login to GHCR
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify package is absent or an exact signed no-op
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  UPSTREAM_TAG: ${{ steps.identity.outputs.upstream_tag }}
                  UPSTREAM_SHA: ${{ steps.identity.outputs.upstream_sha }}
                  VERIFY_GIT: "1"
              shell: bash
              run: |
                  set -Eeuo pipefail
                  output="$RUNNER_TEMP/release.json"
                  .github/scripts/resolve-fork-release.sh > "$output"
                  {
                    printf 'decision=%s\n' "$(jq -r .decision "$output")"
                    printf 'stable=%s\n' "$(jq -r .stable "$output")"
                    printf 'tags<<EOF\n'
                    jq -r '.tags[]' "$output"
                    printf 'EOF\n'
                  } >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              if: steps.release.outputs.decision == 'publish'
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: Build and push exact image tags
              id: build
              if: steps.release.outputs.decision == 'publish'
              uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
              with:
                  context: .
                  file: Dockerfile.standalone-infisical
                  platforms: linux/amd64
                  push: true
                  provenance: mode=max
                  tags: ${{ steps.release.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.version=${{ steps.identity.outputs.upstream_tag }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      io.infisical.upstream.tag=${{ steps.identity.outputs.upstream_tag }}
                      io.infisical.upstream.revision=${{ steps.identity.outputs.upstream_sha }}
                      io.infisical.fork.revision=${{ github.sha }}
                  build-args: |
                      INFISICAL_PLATFORM_VERSION=${{ steps.identity.outputs.upstream_tag }}
                      DD_GIT_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
                      DD_GIT_COMMIT_SHA=${{ github.sha }}
                      UPSTREAM_TAG=${{ steps.identity.outputs.upstream_tag }}
                      UPSTREAM_COMMIT_SHA=${{ steps.identity.outputs.upstream_sha }}
                      FORK_COMMIT_SHA=${{ github.sha }}

            - name: Attest pushed image digest
              if: steps.release.outputs.decision == 'publish'
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true

            - name: Verify published digest and signed T/U/F identity
              if: steps.release.outputs.decision == 'publish'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  UPSTREAM_TAG: ${{ steps.identity.outputs.upstream_tag }}
                  UPSTREAM_SHA: ${{ steps.identity.outputs.upstream_sha }}
                  VERIFY_GIT: "1"
              shell: bash
              run: |
                  set -Eeuo pipefail
                  for attempt in 1 2 3 4 5; do
                    if .github/scripts/resolve-fork-release.sh > "$RUNNER_TEMP/release-post-publish.json" &&
                      jq -e '.decision == "noop"' "$RUNNER_TEMP/release-post-publish.json" >/dev/null; then
                      exit 0
                    fi
                    sleep $((attempt * 5))
                  done
                  printf 'Published package failed immutable identity verification.\n' >&2
                  exit 1

            - name: Record verified no-op
              if: steps.release.outputs.decision == 'noop'
              run: printf 'Exact signed T/U/F package already exists; no image was rebuilt or overwritten.\n'
